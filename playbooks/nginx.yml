---
- name: Install and start nginx (Morpheus demo)
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Deploy demo page
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: "<h1>Deployed by HPE Morpheus + Ansible</h1>\n"

    - name: Ensure nginx is running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
